[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "usbipd-tui"
version = "0.1.0"
description = "A terminal UI for sharing, attaching, and managing USB devices in WSL2 using usbipd-win."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    { name = "Gabriel Durante" },
]
keywords = [
    "python",
    "terminal-ui",
    "textual",
    "tui",
    "usb",
    "usbip",
    "usbipd",
    "usbipd-win",
    "windows",
    "wsl",
    "wsl2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.9",
    "textual>=0.89.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "pytest>=8.0,<10.0",
]

[project.scripts]
usbipd-tui = "wsl2_usb:main"

[project.urls]
Homepage = "https://github.com/gabrieldurante/usbipd-tui"
Repository = "https://github.com/gabrieldurante/usbipd-tui.git"
Issues = "https://github.com/gabrieldurante/usbipd-tui/issues"
Changelog = "https://github.com/gabrieldurante/usbipd-tui/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["wsl2_usb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
